# Netlify Configuration for IRIS Platform
# Next.js Monorepo Deployment with npm workspaces

[build]
  # NO usar base directory para monorepos con workspaces
  # Netlify debe instalar desde la raíz
  base = ""
  
  # Instalar dependencias en raíz y luego build del workspace específico
  command = "npm install && npm run build:web"
  
  # Publish directory (relativo a la raíz ahora)
  publish = "apps/web/.next"

# Use the official Next.js plugin for SSR/ISR support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables for build
[build.environment]
  NODE_VERSION = "20"
  # --include=dev: Netlify fija NODE_ENV=production antes del install, lo que
  # hace que npm omita devDependencies (@types/node, @types/react, etc.) que
  # "next build" sigue necesitando para su chequeo de TypeScript aunque el
  # build sea de producción. Sin esto, el build falla en "Running TypeScript"
  # pidiendo @types/node aunque esté declarado en package.json.
  NPM_FLAGS = "--legacy-peer-deps --include=dev"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
